<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bài 8: Acid</title>
  <meta name="description"
    content="Trải nghiệm mô hình tương tác 3D và thí nghiệm trực quan về Khái niệm và Bảng tính chất hóa học của Acid." />
  <meta name="theme-color" content="#060b18" />
  <!-- Icon hiển thị trên tab trình duyệt (Favicon dạng SVG) -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
  <!-- Ngăn hiện tượng chớp nháy giao diện (FOUC) khi toggle Dark/Light mode -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        var metaTheme = document.querySelector('meta[name="theme-color"]');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#060b18');
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#f8fafc');
        } else {
          // Mặc định là light mode
          document.documentElement.classList.remove('dark');
          if (metaTheme) metaTheme.setAttribute('content', '#f8fafc');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
